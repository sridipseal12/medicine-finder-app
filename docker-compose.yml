services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medicine_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "878906"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:878906@db:5432/medicine_db
    depends_on:
      - db
    expose:
      - "8000"

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
